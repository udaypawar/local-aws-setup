name: setup

services:
  ministack:
    image: ministackorg/ministack:1.5.41
    container_name: ministack
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ministack-state:/var/lib/ministack-state
      - ministack-s3:/var/lib/ministack-s3
    restart: unless-stopped
    environment:
      AWS_DEFAULT_REGION: us-east-1
      DOCKER_NETWORK: setup_default

      # Persist emulated AWS metadata
      PERSIST_STATE: "1"
      STATE_DIR: /var/lib/ministack-state

      # S3 object persistence
      S3_PERSIST: "1"
      S3_DATA_DIR: /var/lib/ministack-s3

      # RDS PostgreSQL persistence
      RDS_PERSIST: "1"
      RDS_BASE_PORT: "15432"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

    networks:
      - default

  ministack-init:
    image: amazon/aws-cli:latest

    depends_on:
      ministack:
        condition: service_healthy

    volumes:
      - ./init-ecs.sh:/init-ecs.sh:ro

    entrypoint:
      - /bin/sh
      - /init-ecs.sh

    environment:
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"

      RDS_DB_IDENTIFIER: ${RDS_DB_IDENTIFIER:-jj-postgres}
      RDS_DB_NAME: ${RDS_DB_NAME:-jamunjar}
      RDS_MASTER_USERNAME: ${RDS_MASTER_USERNAME:-jamunjar}
      RDS_MASTER_PASSWORD: ${RDS_MASTER_PASSWORD:?Create .env with RDS_MASTER_PASSWORD}

      S3_BUCKETS: ${S3_BUCKETS:-s3-uploads-local,s3-documents-local}

      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-s3-jobs-local}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-s3-jobs-dlq-local}

    networks:
      - default

  local-gateway:
    image: nginx:alpine
    container_name: s3-local-gateway

    depends_on:
      ministack-init:
        condition: service_completed_successfully

    ports:
      - "80:80"

    volumes:
      - ./nginx/local-gateway.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    networks:
      - default

  # Three website image builders

  web-1:
    build: ./code/web-1
    image: web-1:local
    profiles: ["build-only"]

  web-2:
    build: ./code/web-2
    image: web-2:local
    profiles: ["build-only"]

  web-3:
    build: ./code/web-3
    image: web-3:local
    profiles: ["build-only"]

  # Seven API image builders

  api-1:
    build: ./code/api-1
    image: api-1:local
    profiles: ["build-only"]

  api-2:
    build: ./code/api-2
    image: api-2:local
    profiles: ["build-only"]

  api-3:
    build: ./code/api-3
    image: api-3:local
    profiles: ["build-only"]

  api-4:
    build: ./code/api-4
    image: api-4:local
    profiles: ["build-only"]

  api-5:
    build: ./code/api-5
    image: api-5:local
    profiles: ["build-only"]

  api-6:
    build: ./code/api-6
    image: api-6:local
    profiles: ["build-only"]

  api-7:
    build: ./code/api-7
    image: api-7:local
    profiles: ["build-only"]

networks:
  default:
    name: setup_default

volumes:
  ministack-state:
  ministack-s3:
